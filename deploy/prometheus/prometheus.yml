global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: dayorder-single-node

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: dayorder-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9090"]

  - job_name: dayorder-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9091"]

  - job_name: dayorder-caddy
    metrics_path: /metrics
    static_configs:
      - targets: ["caddy:2019"]

  - job_name: dayorder-node-textfile
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]
