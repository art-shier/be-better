name: dayorder-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dayorder}
      POSTGRES_USER: ${POSTGRES_USER:-dayorder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dayorder-development-only}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dayorder-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  dayorder-postgres-dev:
