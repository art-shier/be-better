name: dayorder-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dayorder}
      POSTGRES_USER: ${POSTGRES_USER:-dayorder_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dayorder-admin-development-only}
      DAYORDER_MIGRATOR_DB_PASSWORD: ${DAYORDER_MIGRATOR_DB_PASSWORD:-dayorder-migrator-development-only}
      DAYORDER_API_DB_PASSWORD: ${DAYORDER_API_DB_PASSWORD:-dayorder-api-development-only}
      DAYORDER_WORKER_DB_PASSWORD: ${DAYORDER_WORKER_DB_PASSWORD:-dayorder-worker-development-only}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dayorder-postgres-dev:/var/lib/postgresql/data
      - ./deploy/scripts:/opt/dayorder:ro
      - ./deploy/scripts/bootstrap-roles.sh:/docker-entrypoint-initdb.d/010-bootstrap-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  dayorder-postgres-dev:
