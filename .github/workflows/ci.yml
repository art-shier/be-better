name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.7.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run build:web
      - run: npm run test:architecture
      - run: npm run test:deploy

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: apps/api/go.sum
      - run: go test ./apps/api/...
      - run: go test -race ./apps/api/...
      - run: go vet ./apps/api/...
      - run: go build ./apps/api/...
      - name: Check sqlc generated files
        shell: bash
        run: |
          GOWORK=off go tool -C apps/api -modfile tools.mod sqlc generate -f sqlc.yaml
          git diff --exit-code -- apps/api/internal/db/gen

  runtime:
    runs-on: ubuntu-latest
    needs: [web, go]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.7.0"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: apps/api/go.sum
      - name: Test runtime acceptance diagnostics
        shell: pwsh
        run: ./scripts/runtime-postgres-acceptance.Tests.ps1
      - name: Test load smoke client
        run: node --test ./scripts/load-smoke.test.mjs
      - name: Run PostgreSQL resource and synchronization acceptance
        shell: pwsh
        run: ./scripts/runtime-postgres-acceptance.ps1 -RequireDocker

  compose:
    runs-on: ubuntu-latest
    needs: [web, go, runtime]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare ephemeral CI secrets
        shell: bash
        run: |
          cp deploy/env.production.example deploy/.env.production
          sed -i 's/dayorder.example.invalid/localhost/g' deploy/.env.production
          mkdir -p deploy/secrets
          for name in postgres_admin_password migrator_db_password api_db_password worker_db_password backup_db_password monitor_db_password auth_hmac_key smtp_password pgbackrest_cipher_pass; do
            printf '%s' "ci-$name-0123456789abcdef0123456789abcdef" > "deploy/secrets/$name"
          done
          printf '%s' 'postgres://dayorder_migrator:ci-migrator_db_password-0123456789abcdef0123456789abcdef@postgres:5432/dayorder?sslmode=disable&search_path=dayorder' > deploy/secrets/migration_database_url
          printf '%s' 'postgres://dayorder_api:ci-api_db_password-0123456789abcdef0123456789abcdef@postgres:5432/dayorder?sslmode=disable' > deploy/secrets/api_database_url
          printf '%s' 'postgres://dayorder_worker:ci-worker_db_password-0123456789abcdef0123456789abcdef@postgres:5432/dayorder?sslmode=disable' > deploy/secrets/worker_database_url
          sudo chown "$(id -u):10001" deploy/secrets/*
          chmod 640 deploy/secrets/*
          chmod 600 deploy/.env.production
      - name: Validate Compose model
        run: docker compose --env-file deploy/.env.production -f deploy/compose.yaml config --quiet
      - name: Build immutable targets
        run: docker compose --env-file deploy/.env.production -f deploy/compose.yaml build --pull
      - name: Validate Caddy and Prometheus configuration
        shell: bash
        run: |
          docker run --rm --entrypoint caddy \
            -e DAYORDER_DOMAIN=localhost -e DAYORDER_ACME_EMAIL=ops@example.invalid \
            dayorder-web:0.3.0 validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.6.0@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64 \
            check config /etc/prometheus/prometheus.yml
      - name: Run Compose smoke test
        shell: bash
        run: |
          docker compose --env-file deploy/.env.production -f deploy/compose.yaml up -d
          for attempt in $(seq 1 60); do
            if curl --fail --insecure --silent https://localhost/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file deploy/.env.production -f deploy/compose.yaml ps
          docker compose --env-file deploy/.env.production -f deploy/compose.yaml logs --no-color
          exit 1
      - name: Run live TLS and container security acceptance
        shell: pwsh
        run: ./scripts/security-acceptance.ps1 -BaseUrl https://localhost -EnvironmentFile deploy/.env.production -ProjectName dayorder -Insecure
      - name: Capture Compose failure diagnostics
        if: failure()
        shell: bash
        run: |
          docker compose --env-file deploy/.env.production -f deploy/compose.yaml ps --all || true
          docker compose --env-file deploy/.env.production -f deploy/compose.yaml logs --no-color || true
      - name: Tear down Compose
        if: always()
        run: docker compose --env-file deploy/.env.production -f deploy/compose.yaml down --volumes --remove-orphans
